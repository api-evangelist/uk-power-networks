  languages: [python]
  note: >-
    UK Power Networks ships exactly one first-party client library: ukpyn, published to PyPI by its own
    Distribution System Operator data team from the UKPN-DSO GitHub organisation. No JavaScript, Java,
    .NET, Go, Ruby, PHP or Rust client is published by UK Power Networks — the npm registry returns no
    ukpn/ukpowernetworks package. The Opendatasoft JavaScript client below is first-party to the
    platform vendor, not to UK Power Networks, and is recorded as official:false for that reason.
