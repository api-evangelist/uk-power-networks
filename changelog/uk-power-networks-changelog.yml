entries:
- version: 1.2.1
  date: '2026-06-25'
  breaking: false
  changed:
  - Release workflow now auto-promotes the CHANGELOG [Unreleased] section to a dated version heading on each bump.
- version: 1.2.0
  date: '2026-06-25'
  breaking: false
  added:
  - Record.geometry — normalised GeoJSON geometry accessor resolving from geo_shape, spatial_coordinates, geo_point_2d, geo_point or geopoint, converting {"lat","lon"} dicts to GeoJSON Point.
  - dimensions parameter on GISOrchestrator.export_geojson() — "2d" strips Z, "3d" ensures Z, "raw" passes through.
  changed:
  - 'Applied the ukpn- prefix to renamed portal dataset IDs: ltds-table-3a-load-data-observed became ukpn-ltds-table-3a-load-data-observed; dfes-network-headroom-report became ukpn-dfes-network-headroom-report.'
  fixed:
  - NaN / Infinity values in record fields are sanitised to None on parse — the portal occasionally returns float('nan'), which is invalid JSON.
  - GeoJSON Feature wrappers in geometry fields are unwrapped to bare geometry dicts.
  upstream_signal: >-
    The dataset-ID renames are a real, undocumented breaking change on the API side that surfaced
    only in the SDK changelog. The portal itself published no notice.
- version: 0.1.10
  date: null
  breaking: false
  chore:
  - Tidied pyproject.toml dependency declarations.
- version: 0.1.9
  date: null
  breaking: false
  fixed:
  - NOTICE file now correctly references CC-BY-4.0 (was Apache 2.0).
  - Backfilled changelog entries for v0.1.1 through v0.1.8.
- version: 0.1.8
  date: '2025-03-12'
  breaking: false
  added:
  - Production PyPI publish workflow with trusted publishing.
  - TestPyPI pre-release publish workflow.
  fixed:
  - Pinned GitHub Action SHAs for CodeQL compliance.
  - Automatic dev branch sync after version-tag bumps on main.
  - Test fixes for curtailment column names, LTDS substation columns, CLI parser and the Record model.
- version: 0.1.7
