api_change_signals:
  version_in_path: /api/explore/{version} — v2.0 and v2.1 both live
  deprecation_header: ODS-Explore-API-Deprecation (exposed via CORS on every response)
  dataset_modified_timestamp: per-dataset metas.default.modified
  registry_audit: >-
    A daily GitHub Actions job in the SDK repo audits the portal catalogue and opens a triage issue
    when new unmanaged datasets appear — an automated detector for catalogue change.
