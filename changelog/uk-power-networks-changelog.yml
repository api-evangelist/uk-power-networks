scope_note: >-
  This is the changelog for ukpyn, the official UK Power Networks Python client — the only dated,
  structured change record UK Power Networks publishes for anything in this API estate. There is no
  changelog for the Explore API itself: the API's change signal is the version segment in the URL
  (v2.0 / v2.1) and the ODS-Explore-API-Deprecation response header, and the data's change signal is
  the per-dataset modified timestamp. Recorded as an SDK changelog rather than presented as an API
  changelog.
