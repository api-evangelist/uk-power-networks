apis:
- aid: uk-power-networks:uk-power-networks-explore-api-v2-1
  name: UK Power Networks Open Data Explore API v2.1
  description: >-
    The current read-only REST API behind the UK Power Networks Open Data Portal,
    served from the company's own opendatasoft.com subdomain under an Opendatasoft
    Explore API v2.1 contract. Sixteen GET endpoints cover catalogue search, dataset
    metadata, record query with an ODSQL where/select/group_by dialect, facets,
    attachments, and bulk exports in CSV, JSON, Parquet, GeoJSON, GPX and DCAT-AP.
    136 UK Power Networks datasets are catalogued: live faults from the Distribution
    Network Management System, carbon intensity, the embedded capacity register,
    LTDS tables, flexibility dispatches and tenders, curtailment events, network
    losses, substation and LV-feeder smart meter aggregates, GIS asset and boundary
    layers, and the OZEV National Chargepoint Register. Catalogue metadata answers
    anonymously; records for most datasets require a free account API key passed as
    an apikey query parameter. Anonymous rate limit observed at 10,000 calls per day.
  humanURL: https://ukpowernetworks.opendatasoft.com/api-console/explore/v2.1/
  baseURL: https://ukpowernetworks.opendatasoft.com/api/explore/v2.1
