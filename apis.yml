- aid: uk-power-networks:uk-power-networks-explore-api-v2-0
  name: UK Power Networks Open Data Explore API v2.0
  description: >-
    The previous version of the UK Power Networks Open Data Portal REST API, still
    live and still serving its own OpenAPI 3.0.3 contract at the company domain. Same
    sixteen endpoints and same catalogue as v2.1, distinguished by the version segment
    in the base URL; the platform advertises deprecation through an
    ODS-Explore-API-Deprecation response header. Recorded here because it is a real,
    reachable, separately-contracted surface, not because it is the one to build on.
  humanURL: https://ukpowernetworks.opendatasoft.com/api-console/explore/v2.1/
