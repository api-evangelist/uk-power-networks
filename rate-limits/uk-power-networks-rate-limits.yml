over_limit:
  status: 429
  body_fields: [errorcode, error, call_limit, limit_time_unit, reset_time]
  spec_example_call_limit: 10000
  spec_example_unit: day
  guidance: >-
    Back off to reset_time. Because every operation is a safe GET, retry after the window resets is
    always safe. For bulk extraction use /catalog/datasets/{dataset_id}/exports/{format}, which
    returns a whole dataset in one call instead of burning the budget on pagination.
