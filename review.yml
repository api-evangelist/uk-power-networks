officialTooling:
  sdk:
    name: ukpyn
    description: >-
      "UK Power Networks Distribution System Operator open source python package to
      interact with our Open Data Portal and unlock value." Themed orchestrators for
      ltds, dfes, dnoa, network, flexibility, curtailment, ders, gis and powerflow,
      sync and async, typed, with exports to CSV/JSON/Excel/GeoJSON/Parquet.
    repo: https://github.com/UKPN-DSO/ukpyn
    repoHttpStatus: 200
    docs: https://ukpn-dso.github.io/ukpyn/
    docsHttpStatus: 200
    pypi: https://pypi.org/project/ukpyn/
    pypiHttpStatus: 200
    version: 1.2.1
    licence: CC-BY-4.0
    created: '2026-02-04'
    lastPush: '2026-07-27T07:26:03Z'
    stars: 16
    note: >-
      Actively maintained — the last push landed hours before this review. An
      operator that ships and maintains its own client library is running a
      developer programme, not a data dump.
  githubOrganizations:
  - url: https://github.com/UKPN-DSO
    apiStatus: 200
    name: UK Power Networks - Distribution System Operator
    publicRepos: 6
    note: 'Repos: ukpyn, delta-rs, arrow-rs-object-store, interactive-svgs, DFES-visualisation, .github'
  - url: https://github.com/UK-Power-Networks
    apiStatus: 200
    publicRepos: 1
    note: DFES-visualisation only. Secondary org.
  thirdPartyRedistribution:
  - probe: data.gov.uk CKAN package search for "UK Power Networks"
    url: https://ckan.publishing.service.gov.uk/api/3/action/package_search?q=%22UK%20Power%20Networks%22
    httpStatus: 200
    fetched: '2026-07-27'
    result: >-
      25 packages, published by the Greater London Authority (London Datastore)
      rather than by UK Power Networks — flexibility dispatches, proposed
      streetworks, data centre profiles and utilisation, low carbon technologies.
      The company's data travels beyond its own portal, but the company does not
      publish to the national catalogue itself.

